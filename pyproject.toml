[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coil-ai-sweep"
version = "0.1.0"
description = "Backend-only experimental AI sweep infrastructure for Coil-Analyzing"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
]

[project.optional-dependencies]
test = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
